<!doctype html>

<style>
  body { margin: 0; font-family: 'Noto Sans JP', sans-serif; color: #1a1a1a; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 60px; }
  .h2 { font-family: 'Zen Kaku Gothic Antique', sans-serif; font-weight: 900; font-size: 26px; color: #1a1a1a; margin: 0 0 28px; }

  .noticeCard { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 0 28px; max-width: 700px; box-sizing: border-box; margin: 0 auto; }
  .noticeRow { display: flex; align-items: center; gap: 24px; padding: 18px 0; border-bottom: 1px solid #eee; }
  .noticeRow:last-child { border-bottom: none; }
  .noticeTitle { flex: 1; font-size: 13px; font-weight: 700; line-height: 1.7; color: #1a1a1a; }
  .noticeDate { width: 130px; font-size: 12px; color: #555; flex-shrink: 0; }
  .noticePdf { flex-shrink: 0; display: inline-block; padding: 6px 16px; border: 1px solid #bbb; border-radius: 4px; font-size: 12px; font-weight: 500; color: #555; }
  .noticePdf:hover { background: #555; color: #fff; border-color: #555; }

  @media (max-width: 768px) {
    .wrap { padding: 0 20px !important; }
    .h2 { font-size: 22px !important; margin-bottom: 20px !important; }
    .siteHeader { padding: 14px 20px !important; }
    .siteHeader img { height: 40px !important; }
    .navLinks { display: none !important; }
    .noticeCard { padding: 0 16px; }
    .noticeRow { flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px 0; }
    .noticeTitle { font-size: 13px; }
    .noticeDate { width: auto; }
    .siteFooter { grid-template-columns: 1fr !important; row-gap: 14px !important; text-align: center !important; padding: 28px 20px !important; }
    .footerNotice { text-align: center !important; padding-right: 0 !important; }
    .footerLinks { flex-wrap: wrap !important; justify-content: center !important; gap: 12px 16px !important; }
  }
</style>
</head>

<div style="width:100%;max-width:1440px;margin:0 auto;background:#ffffff;position:relative;overflow-x:hidden;">
